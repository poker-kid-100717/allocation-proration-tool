name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled; runs on main never are, so a newer push
# can't abort a deploy that's in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rounds_test
          POSTGRES_USER: rounds
          POSTGRES_PASSWORD: rounds-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rounds -d rounds_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://rounds:rounds-ci@127.0.0.1:5432/rounds_test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      # Deploys start once the Cloudflare/app secrets exist; until then this
      # job skips with a notice instead of failing the run.
      - name: Check deploy secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for value in "$CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_ACCOUNT_ID"; do
            if [ -z "$value" ]; then
              echo "::notice::Deploy secrets are not configured yet; skipping deploy."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Workers
        if: steps.secrets.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Uploaded as the Worker secret DATABASE_URL once that repository secret exists; until then
          # the calculator works and /api/rounds answers 503.
          secrets: ${{ secrets.DATABASE_URL != '' && 'DATABASE_URL' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Smoke test production
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$DEPLOYMENT_URL/api/health"
          curl --fail --silent --show-error -X POST "$DEPLOYMENT_URL/api/prorate" \
            -H 'content-type: application/json' \
            -d '{"allocation_amount":100,"investor_amounts":[{"name":"A","requested_amount":100,"average_amount":100},{"name":"B","requested_amount":25,"average_amount":25}]}' \
            | grep -q '"A":80'
          curl --fail --silent --show-error "$DEPLOYMENT_URL/" | grep -q '<div id="root">'
