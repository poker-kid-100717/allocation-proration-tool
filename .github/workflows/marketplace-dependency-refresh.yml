name: Marketplace dependency refresh (temporary)
on:
  push:
    branches: [chore/marketplace-demo]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Regenerate lockfile with upstream security fixes
        run: |
          npm install --save-dev --save-exact wrangler@4.166.0 --package-lock-only --ignore-scripts --no-audit
          npm audit fix --package-lock-only --ignore-scripts
          npm ci
          npm audit --audit-level=high
          npm run check
          npm run build:demo
      - name: Record verified generated manifests
        run: |
          node --input-type=commonjs - <<'NODE'
          const fs = require('node:fs');
          for (const name of ['package.json','package-lock.json']) {
            const b64 = fs.readFileSync(name).toString('base64');
            for(let i=0;i<b64.length;i+=1200) console.log('MARKETPLACE_MANIFEST '+name+' '+(i/1200)+' '+b64.slice(i,i+1200));
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: validated-manifests
          path: |
            package.json
            package-lock.json
